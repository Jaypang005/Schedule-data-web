services:
  - type: web
    name: teacher-schedule-chatbot
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SCHEDULE_AI_ENABLED
        value: "0"
      - key: SCHEDULE_PARSER_LOG
        value: "0"
